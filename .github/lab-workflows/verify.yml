# Reference recipe only. Authoritative execution belongs to Git LAN / the protected lab.
# This directory is outside GitHub Actions workflow discovery.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: native package validation tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: install Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          foxhole_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [[ -d "$foxhole_sdk_root" ]] || { echo "Android SDK root not found" >&2; exit 1; }
          foxhole_sdkmanager="$foxhole_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$foxhole_sdkmanager" ]]; then
            foxhole_sdkmanager="$(find "$foxhole_sdk_root/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -n 1)"
          fi
          [[ -n "$foxhole_sdkmanager" && -x "$foxhole_sdkmanager" ]] || { echo "sdkmanager not found" >&2; exit 1; }
          {
            echo "ANDROID_HOME=$foxhole_sdk_root"
            echo "ANDROID_SDK_ROOT=$foxhole_sdk_root"
          } >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$foxhole_sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$foxhole_sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: verify wrapper
        run: ./gradlew --no-daemon --console=plain --version

      - name: JVM tests and Android lint
        run: |
          ./gradlew --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace \
            :vpn-profile:test :vpn-engine:testDebugUnitTest :app:testDebugUnitTest \
            :app:lintDebug :app:lintRelease
